name: Secret scan

on:
  push:
    branches: [feature/**]
  pull_request:
    branches: [feature/**]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks OSS
        shell: bash
        run: |
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" \
            --output /tmp/gitleaks_checksums.txt
          grep "${archive}" /tmp/gitleaks_checksums.txt | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan repository
        run: gitleaks detect --source=. --redact --no-banner
